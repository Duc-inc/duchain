on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Free runner capacity by cancelling superseded PR runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & test (stub hasher)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -short

  randomx-build:
    name: Build & test (real RandomX, -tags randomx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install librandomx
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
          git clone https://github.com/tevador/RandomX
          cd RandomX && mkdir build && cd build
          cmake -DARCH=native ..
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig

      - name: Build (CGO + randomx tag)
        run: CGO_ENABLED=1 go build -tags randomx ./...

      - name: Test consensus/randomx (real hasher)
        run: CGO_ENABLED=1 go test -tags randomx ./consensus/randomx/...
